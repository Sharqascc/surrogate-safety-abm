name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── REQUIRED: must pass for merge ────────────────────────────
  test:
    name: test (py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -q --no-header
             --cov=src/surrogate_safety_abm --cov-report=xml
             -p no:cacheprovider
      - if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with: {name: coverage, path: coverage.xml}

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  # ── ADVISORY: job runs, but continue-on-error keeps PR unblocked
  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ruff
      - run: ruff check src tests || true
      - run: ruff format --check src tests || true

  typecheck:
    name: typecheck (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]" mypy
      - run: mypy src/surrogate_safety_abm/ssm
             src/surrogate_safety_abm/simulation/engine.py
             || true

  security:
    name: security (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]" pip-audit
      - run: bandit -r src -ll || true
      - run: pip-audit --strict || true

  coverage-diff:
    name: coverage-diff (advisory)
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: coverage}
      - run: pip install diff-cover
      - run: diff-cover coverage.xml
               --compare-branch=origin/${{ github.base_ref }}
               --fail-under=80 || true
