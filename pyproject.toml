[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surrogate-safety-abm"
version = "0.1.0"
description = "Agent-based modelling of surrogate safety measures at unsignalized intersections in India"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sharqascc" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pydantic>=2.5",
    "networkx>=3.2",
]

[project.scripts]
surrogate-safety-sim = "surrogate_safety_abm.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.100",
    "mypy>=1.8",
    "ruff>=0.4",
    "pre-commit>=3.6",
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/surrogate_safety_abm"]

[tool.hatch.build.targets.wheel.force-include]
"src/surrogate_safety_abm/py.typed" = "surrogate_safety_abm/py.typed"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "seaborn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra --cov=surrogate_safety_abm --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: end-to-end tests that span multiple modules",
]

[tool.coverage.run]
source = ["src/surrogate_safety_abm"]
branch = true
